# FunLink CI — the standing gates (see AGENTS.md).
# Pint → PHPStan (level 7) → Pest on PostgreSQL + PostGIS, plus the asset build.
# Runs on pushes to main and on pull requests targeting main.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: funlynk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pgsql, pdo_pgsql, gd, bcmath, intl, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (static analysis, level 7)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pest (test suite on PostgreSQL + PostGIS)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: funlynk_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test
