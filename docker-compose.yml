version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - reverb

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DB_HOST=pgsql
      - REDIS_HOST=redis
    depends_on:
      - pgsql
      - redis

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file:
      - .env
    environment:
      - DB_HOST=pgsql
      - REDIS_HOST=redis
    depends_on:
      - redis

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    env_file:
      - .env
    environment:
      - DB_HOST=pgsql
      - REDIS_HOST=redis
    depends_on:
      - redis
      - pgsql

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      - DB_HOST=pgsql
      - REDIS_HOST=redis
    depends_on:
      - redis
      - pgsql

  pgsql:
    image: postgis/postgis:15-3.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-funlynk}
      POSTGRES_USER: ${DB_USERNAME:-funlynk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgsql_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-funlynk_redis_2025}"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-funlynk}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-funlynk_minio_password_2025}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  pgsql_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
